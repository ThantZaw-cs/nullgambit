name: astra-v8-search

on:
  push:
    branches: [astra-v8-search]
    paths: [benchmarks/astra-v8/ci-trigger.json]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: astra-v8-search-fixed-batch
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMBA_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  V7_SHA: aba3db18ebe424b2025b3d967b88057b6ad242978cc328accc1642e2c8a91b3d

jobs:
  acceptance:
    if: "!contains(github.event.head_commit.message, '[v8-competition-')"
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked Python 3.12 dependencies
        run: uv sync --locked
      - name: Validate explicit freeze trigger and one CPU
        id: freeze
        run: |
          test ! -e data/online
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p artifacts/v8-search
          uv pip freeze > artifacts/v8-search/installed.txt
          git rev-parse HEAD > artifacts/v8-search/checkout.txt
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          assert platform.machine() == "x86_64" and sys.version_info[:2] == (3, 12)
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          trigger = json.loads(Path("benchmarks/astra-v8/ci-trigger.json").read_text())
          assert trigger["phase"] in {"preflight", "formal"}
          assert digest("prototypes/search_core/agent.py") == trigger["candidate_sha256"]
          assert digest("baselines/online_v7/agent.py") == os.environ["V7_SHA"]
          if trigger["phase"] == "formal":
              assert digest("benchmarks/astra-v8/formal-plan.json") == trigger["formal_plan_sha256"]
              plan = json.loads(Path("benchmarks/astra-v8/formal-plan.json").read_text())
              assert plan["candidate_sha256"] == trigger["candidate_sha256"]
              assert all(plan["gate"].values())
              summary_path = Path(trigger["fast_summary_path"])
              assert summary_path.is_relative_to("benchmarks/astra-v8")
              assert digest(summary_path) == trigger["fast_summary_sha256"]
              fast = json.loads(summary_path.read_text())
              assert fast["complete"] and fast["actual_games"] == 40
              assert fast["candidate_sha256"] == trigger["candidate_sha256"]
              assert fast["opponent_sha256"] == os.environ["V7_SHA"]
              assert fast["voids"] == fast["failures"] == 0
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              print("V8_CPU=" + str(min(os.sched_getaffinity(0))), file=handle)
              print("V8_SHA=" + trigger["candidate_sha256"], file=handle)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              print("phase=" + trigger["phase"], file=handle)
          Path("artifacts/v8-search/ci-trigger.json").write_text(json.dumps(trigger, indent=2) + "\n")
          PY
      - name: Ruff
        run: taskset -c "$V8_CPU" uv run --no-sync ruff check . 2>&1 | tee artifacts/v8-search/ruff.log
      - name: Strict mypy
        run: taskset -c "$V8_CPU" uv run --no-sync mypy 2>&1 | tee artifacts/v8-search/mypy.log
      - name: Complete correctness suite
        run: timeout 10m taskset -c "$V8_CPU" uv run --no-sync python -m unittest discover -s tests -v 2>&1 | tee artifacts/v8-search/tests.log
      - name: Warm rotating four-way fixed-depth search measurement
        run: |
          ulimit -v 2097152
          timeout 11m taskset -c "$V8_CPU" uv run --no-sync python -m tools.v8_perf --out artifacts/v8-search/performance --depth 5 --repeats 3 --limit-s 600 2>&1 | tee artifacts/v8-search/performance.log
      - name: Candidate ZIP, isolated real search and independent runner
        run: |
          ulimit -v 2097152
          timeout 5m taskset -c "$V8_CPU" uv run --no-sync python -m tools.v8_package --source prototypes/search_core/agent.py --sha256 "$V8_SHA" --out artifacts/v8-search/packages/v8 2>&1 | tee artifacts/v8-search/package.log
      - uses: actions/upload-artifact@v4
        with:
          name: astra-v8-preflight-${{ github.sha }}
          path: artifacts/v8-search/
          if-no-files-found: error
          retention-days: 30
      - name: One predeclared formal batch, 20 games at 120+0.5
        if: success() && steps.freeze.outputs.phase == 'formal' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[v8-formal-once]')
        run: |
          ulimit -v 2097152
          timeout --signal=TERM --kill-after=30s 101m taskset -c "$V8_CPU" uv run --no-sync python -m tools.v8_match --plan benchmarks/astra-v8/formal-plan.json --out artifacts/v8-search/formal 2>&1 | tee artifacts/v8-search/formal.log
      - name: Audit every completed formal PGN and exact clock trace
        if: always()
        run: |
          if test -f artifacts/v8-search/formal/results.json; then
            uv run --no-sync python -m tools.summarize_v8_matches artifacts/v8-search/formal | tee artifacts/v8-search/formal-summary.log
          else
            echo 'Formal NOT RUN. Requires formal freeze trigger, explicit [v8-formal-once] head commit, first run attempt, and successful preflight. No automatic match replay.' | tee artifacts/v8-search/formal-not-run.txt
          fi
      - name: Verify tracked inputs unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-v8-search-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/v8-search/
          if-no-files-found: error
          retention-days: 30

  competition:
    if: contains(github.event.head_commit.message, '[v8-competition-') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: false
      - name: Install previously verified locked dependencies
        run: uv sync --locked
      - name: Check original plans, exact sources and record gate before first game
        run: |
          test ! -e data/online
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p artifacts/v8-search
          uv pip freeze > artifacts/v8-search/installed.txt
          git rev-parse HEAD > artifacts/v8-search/checkout.txt
          uv run --no-sync python - <<'PYCODE'
          import ast, hashlib, json, os, platform, sys
          from datetime import UTC, datetime
          from pathlib import Path
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          trigger = json.loads(Path("benchmarks/astra-v8/ci-trigger.json").read_text())
          assert trigger["phase"] in {"competition", "competition-resume"}
          assert platform.machine() == "x86_64" and sys.version_info[:2] == (3, 12)
          assert digest("prototypes/search_core/agent.py") == trigger["candidate_sha256"]
          assert digest("baselines/online_v7/agent.py") == os.environ["V7_SHA"]
          options = {}
          for node in ast.parse(Path("prototypes/search_core/agent.py").read_text()).body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in {"USE_SCORE_TT", "USE_LMR"}:
                          options[target.id] = ast.literal_eval(node.value)
          assert options == {"USE_SCORE_TT": True, "USE_LMR": True}, options
          for stage in ("fast", "formal"):
              assert digest(f"benchmarks/astra-v8/{stage}-plan.json") == trigger[f"{stage}_plan_sha256"]
          assert datetime.now(UTC) < datetime.fromisoformat(trigger["deadline_utc"])
          Path("artifacts/v8-search/acceptance-trigger.json").write_text(json.dumps(trigger, indent=2)+"\n")
          Path("artifacts/v8-search/promotion-rule.txt").write_text("Before game 1: complete40, zero failures/VOID, score>=50% -> original formal20. Practical continuation gate, not strength proof.\n")
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              print("V8_CPU="+str(min(os.sched_getaffinity(0))), file=handle)
              print("V8_PHASE="+trigger["phase"], file=handle)
          if trigger["phase"] == "competition-resume":
              import shutil
              assert trigger["extra_execution_s"] == 600
              assert trigger["resume_authorization"] == "User approved completing unfinished IDs after infrastructure cap; preserve all completed WDL and original interrupted attempt."
              source=Path(trigger["checkpoint_directory"])
              assert source.is_relative_to("benchmarks/astra-v8")
              manifest=json.loads((source/"checkpoint-manifest.json").read_text())
              assert digest(source/"checkpoint-manifest.json") == trigger["checkpoint_manifest_sha256"]
              assert set(manifest) == {str(f.relative_to(source)) for f in source.rglob("*") if f.is_file() and f.name != "checkpoint-manifest.json"}
              for name, sha in manifest.items():
                  relative=Path(name)
                  assert not relative.is_absolute() and ".." not in relative.parts
                  assert not (source/relative).is_symlink()
                  assert digest(source/relative) == sha
              report=json.loads((source/"results.json").read_text())
              assert report["status"] == "incomplete" and "pending_game" not in report
              assert report["candidate_sha256"] == trigger["candidate_sha256"]
              assert report["opponent_sha256"] == os.environ["V7_SHA"]
              assert (source/"plan.json").read_bytes() == Path("benchmarks/astra-v8/fast-plan.json").read_bytes()
              shutil.copytree(source,"artifacts/v8-search/fast")
          PYCODE
      - name: Original fixed40 real-entry games at 10+0.1
        run: |
          ulimit -v 2097152
          if test "$V8_PHASE" = competition-resume; then
            V8_REMAINING=$(uv run --no-sync python - <<'PYCODE'
          from datetime import UTC,datetime
          print(max(1,min(660,int((datetime.fromisoformat("2026-09-10T15:36:03+00:00")-datetime.now(UTC)).total_seconds())-90)))
          PYCODE
            )
            timeout --signal=TERM --kill-after=30s "${V8_REMAINING}s" taskset -c "$V8_CPU" uv run --no-sync python -m tools.v8_match --plan benchmarks/astra-v8/fast-plan.json --out artifacts/v8-search/fast --resume --resume-infrastructure --extra-execution-s 600 --deadline-utc 2026-09-10T15:36:03+00:00 2>&1 | tee artifacts/v8-search/fast-resume.log
          else
            timeout --signal=TERM --kill-after=30s 41m taskset -c "$V8_CPU" uv run --no-sync python -m tools.v8_match --plan benchmarks/astra-v8/fast-plan.json --out artifacts/v8-search/fast 2>&1 | tee artifacts/v8-search/fast.log
          fi
      - name: Audit fast PGNs and clocks; apply predeclared gate
        if: always()
        id: promotion
        run: |
          if test -f artifacts/v8-search/fast/results.json; then
            uv run --no-sync python -m tools.summarize_v8_matches artifacts/v8-search/fast | tee artifacts/v8-search/fast-summary.log
          fi
          uv run --no-sync python - <<'PYCODE'
          import json, os
          from pathlib import Path
          p=Path("artifacts/v8-search/fast/summary.json")
          s=json.loads(p.read_text()) if p.exists() else {}
          promote=(s.get("complete",False) and s.get("actual_games")==40 and s.get("failures")==0 and s.get("voids")==0 and s.get("raw_referee_score",0)>=0.5)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("passed="+str(promote).lower(),file=f)
          Path("artifacts/v8-search/promotion.json").write_text(json.dumps({"passed":promote,"fast_summary":s,"reason":"Complete40, zero failures/VOID, score>=0.5 required"},indent=2)+"\n")
          if promote:
              plan=json.loads(Path("benchmarks/astra-v8/formal-plan.json").read_text())
              plan["gate"]["fast_screen_passed"]=True
              plan["execution_status"]="Original formal20 automatically authorized by audited fast40 threshold."
              Path("artifacts/v8-search/formal-plan.json").write_text(json.dumps(plan,indent=2)+"\n")
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-v8-fast-${{ github.run_id }}
          path: artifacts/v8-search/
          if-no-files-found: error
          retention-days: 30
      - name: Original formal20 real-entry games at 120+0.5
        if: success() && steps.promotion.outputs.passed == 'true'
        run: |
          V8_REMAINING=$(uv run --no-sync python - <<'PYCODE'
          import json
          from datetime import UTC,datetime
          from pathlib import Path
          t=json.loads(Path("benchmarks/astra-v8/ci-trigger.json").read_text())
          print(max(1,min(6060,int((datetime.fromisoformat(t["deadline_utc"])-datetime.now(UTC)).total_seconds())-90)))
          PYCODE
          )
          ulimit -v 2097152
          timeout --signal=TERM --kill-after=30s "${V8_REMAINING}s" taskset -c "$V8_CPU" uv run --no-sync python -m tools.v8_match --plan artifacts/v8-search/formal-plan.json --out artifacts/v8-search/formal 2>&1 | tee artifacts/v8-search/formal.log
      - name: Audit formal results or preserve reason not started
        if: always()
        run: |
          if test -f artifacts/v8-search/formal/results.json; then
            uv run --no-sync python -m tools.summarize_v8_matches artifacts/v8-search/formal | tee artifacts/v8-search/formal-summary.log
          else
            echo 'Formal not started: fast threshold or preceding execution step did not pass; inspect promotion.json and step exit status.' | tee artifacts/v8-search/formal-not-run.txt
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-v8-competition-${{ github.run_id }}
          path: artifacts/v8-search/
          if-no-files-found: error
          retention-days: 30
